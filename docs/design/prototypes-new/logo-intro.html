  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--spacing-40) 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /*
   * ---- 1920x1080 키오스크 스테이지 (node 3237:11947) ----
   * 대기 화면(attract-screen-v2.html) 진입 전에 재생되는 로고 인트로.
   * 로고 글자(패스) 애니메이션이 끝나면 자동으로 대기 화면으로 전환된다.
   */
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--color-background-default);
    overflow: hidden;
    box-shadow: 0 0 0 1px #222;
  }

  .bg-grid {
    position: absolute;
    left: 0;
    top: 0;
    width: 2572.56px;
    height: 1080.28px;
  }

  /* Figma 확인값(node 3237:12040) — 로고 크기/위치/흰색은 기존 그대로, 애니메이션만 새로 추가.
     배경(.bg-grid)은 끝까지 그대로 유지되고, 로고만 페이드아웃된 뒤 대기 화면으로 이동한다. */
  .logo-wrap {
    position: absolute;
    left: 50%;
    top: calc(50% + 10.714px);
    transform: translate(-50%, -50%);
    width: 499.998px;
    height: 63.498px;
    transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .logo-wrap.is-leaving { opacity: 0; }

  .logo-wrap svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /*
   * 글자(패스) 단위 "접힘→펼침" 등장 모션 (FoldText 참고: hinge=top, duration 0.65s,
   * stagger 0.045s, perspective 700px). 로고 SVG가 이미 글자 하나당 path 하나로 분리돼
   * 있어(Vector~Vector_11, "NHN FactoryX" 11자) span으로 쪼갤 필요 없이 path마다
   * --fold-delay만 다르게 줘서 순서대로 접혀 펼쳐지게 한다.
   * transform-box: fill-box + transform-origin: 50% 0%로 각 글자 "위쪽 가장자리"를
   * 경첩(hinge) 삼아 rotateX(-92deg, 위로 접혀 안 보이는 상태)에서 0deg(펼쳐진 상태)로 회전.
   */
  .logo-wrap path {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    backface-visibility: hidden;
    opacity: 0;
    animation: fold-letter 0.65s cubic-bezier(0.22, 1, 0.36, 1) var(--fold-delay, 0ms) both;
  }

  @keyframes fold-letter {
    from {
      opacity: 0;
      transform: perspective(700px) rotateX(-92deg);
      filter: brightness(0.55);
    }
    to {
      opacity: 1;
      transform: perspective(700px) rotateX(0deg);
      filter: brightness(1);
    }
  }
</style>
